{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Student Resource Hub{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'home/style.css' %}">
</head>
<body style="font-family: Arial, sans-serif; margin: 0; padding: 0; background-color: #f4f6f9;">

    <!-- CENTRAL NAVIGATION HEADER BAR -->
    <header style="background-color: #2c3e50; color: white; padding: 15px 40px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1);">
        <h2 style="margin: 0; font-size: 20px;">🎓 Past Question Archive</h2>
        <nav style="display: flex; gap: 20px;">
            <a href="/" style="color: white; text-decoration: none; font-weight: bold;">Home</a>
            <a href="/admin" target="_blank" style="color: #3498db; text-decoration: none; font-weight: bold;">Admin Dashboard</a>
        </nav>
    </header>

    <!-- WRAPPER FOR DYNAMIC CONTENT CONTAINER -->
    <main style="padding: 40px; max-width: 1200px; margin: 0 auto;">
        {% block content %}
        <!-- Your individual page files will inject their unique layouts inside this slot -->
        {% endblock %}
    </main>

    <!-- CENTRAL SITE FOOTER -->
    <footer style="text-align: center; padding: 20px; color: #7f8c8d; font-size: 14px; margin-top: 40px; background-color: #ecf0f1; border-top: 1px solid #bdc3c7;">
        <p>&copy; 2026 Past Question Repository Project. Built for Academic Success.</p>
    </footer>

</body>
</html>
